[package]
name = "loomide-core"
version = "0.1.0"
description = "Rust core for LoomIDE"
edition = "2021"

[lib]
name = "loomide_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "loomide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
notify = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
